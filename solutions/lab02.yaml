apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab02
spec:
  replicas: 3
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports: [ { containerPort: 80 } ]
