apiVersion: v1
kind: ConfigMap
metadata: { name: app-config, namespace: lab05 }
data:
  APP_MODE: production
  APP_COLOR: blue
---
apiVersion: v1
kind: Secret
metadata: { name: app-secret, namespace: lab05 }
type: Opaque
stringData:
  DB_PASSWORD: S3cret-2026
---
apiVersion: v1
kind: Pod
metadata: { name: app, namespace: lab05 }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      envFrom:
        - configMapRef: { name: app-config }
        - secretRef: { name: app-secret }
      volumeMounts:
        - { name: cfg, mountPath: /etc/app }
  volumes:
    - name: cfg
      configMap: { name: app-config }
