# Auto-test du didacticiel : les solutions de référence doivent obtenir 20/20 à chaque lab.
name: Auto-test des labs
on: [workflow_dispatch]
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: labs }
      - run: bash solutions/apply-all.sh
      - run: ./labctl report
      - run: grep -q '^TOTAL;;\([0-9.]*\);\1;20' results/rapport.csv
